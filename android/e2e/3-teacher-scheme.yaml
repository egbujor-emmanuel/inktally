# The teacher already has a marking scheme: InkTally must copy it exactly (alternatives, "do not accept", marks), not re-solve it.
appId: app.redpen.teacher
---
- launchApp
- runFlow:
    when:
      visible: ".*isn't responding"
    commands:
      - tapOn: "Wait"
- extendedWaitUntil:
    visible: "Quick mark"
    timeout: 120000
- tapOn: "New assignment"
- scrollUntilVisible:
    element: "…or type / paste your marking scheme"
    timeout: 30000
- tapOn: "…or type / paste your marking scheme"
- inputText: "1. 56 (1 mark)  2. Abuja - accept FCT or Federal Capital Territory (1 mark)  3. went - do not accept goed (2 marks)"
- hideKeyboard
- scrollUntilVisible:
    element: "Use my marking scheme"
- tapOn: "Use my marking scheme"
- extendedWaitUntil:
    visible: "Check the marking scheme"
    timeout: 150000
# Prove the values come from the DRAFTED scheme editor, not from the text typed above:
# scroll past the typing box until the editor's "Do not accept" field (only in the editor) is on screen.
- scrollUntilVisible:
    element: "Do not accept"
    timeout: 40000
- scrollUntilVisible:
    element: ".*goed.*"
    timeout: 20000
- assertNotVisible: "…or type / paste your marking scheme"
- takeScreenshot: 21-scheme-reject-in-editor
- scrollUntilVisible:
    element: ".*Federal Capital Territory.*"
    direction: UP
    timeout: 20000
- assertNotVisible: "…or type / paste your marking scheme"
- takeScreenshot: 20-scheme-alternative-in-editor
