# Marks the English sample from a photo chosen in the gallery (one photo is marked straight away) (CI pushes english-sheet-photo.jpg first),
# then adds a comment, opens the register and exports Excel.
appId: app.redpen.teacher
---
- launchApp
- runFlow:
    when:
      visible: ".*isn't responding"
    commands:
      - tapOn: "Wait"
- extendedWaitUntil:
    visible: "Quick mark"
    timeout: 120000
- scrollUntilVisible:
    element: "English — Grammar Check"
    timeout: 30000
- tapOn: "English — Grammar Check"
- extendedWaitUntil:
    visible: "Share PDF"
    timeout: 30000
- tapOn: "Mark"
- tapOn: "Student name or number"
- inputText: "Ada Obi"
- hideKeyboard
# The gallery button picks a whole stack (multi-select photo picker): select the one photo, then confirm with "Add".
- tapOn: "Choose photos"
- waitForAnimationToEnd
- takeScreenshot: 10-picker
- tapOn:
    text: "Photo taken on.*"
- takeScreenshot: 10b-picker-selected
- tapOn:
    text: "Add.*"
- extendedWaitUntil:
    visible: "Total: .*"
    timeout: 240000
- takeScreenshot: 11-marked
# The sample sheet's true score is 3/5 (B, D, B, Abuja, runned) — a wrong total fails the run.
- assertVisible: "Total: 3/5"
- repeat:
    while:
      notVisible: "Teacher’s comment"
    times: 10
    commands:
      - swipe:
          start: 50%, 88%
          end: 50%, 62%
          duration: 600
- tapOn: "Teacher’s comment"
- inputText: "Good work. Revise past tenses."
- hideKeyboard
- tapOn: "Save comment"
- assertVisible: "Saved. It is on the marked copy.*"
- repeat:
    while:
      notVisible: "Marked copy for Ada Obi"
    times: 10
    commands:
      - swipe:
          start: 50%, 88%
          end: 50%, 62%
          duration: 600
- takeScreenshot: 12-marked-copy
- tapOn: "Mark register"
- assertVisible: "Ada Obi"
- takeScreenshot: 13-register
- tapOn: "Download Excel (.xlsx)"
- waitForAnimationToEnd
- takeScreenshot: 14-share-xlsx
