# Offline on a phone WITHOUT on-device AI (like the emulator): the photo is saved, then marked automatically when back online.
appId: app.redpen.teacher
---
- launchApp
- runFlow:
    when:
      visible: ".*isn't responding"
    commands:
      - tapOn: "Wait"
- extendedWaitUntil:
    visible: "Quick mark"
    timeout: 120000
- scrollUntilVisible:
    element: "English — Grammar Check"
    timeout: 30000
- tapOn: "English — Grammar Check"
- extendedWaitUntil:
    visible: "Share PDF"
    timeout: 30000
- tapOn: "Mark"
- tapOn: "Student name or number"
- inputText: "Offline Student"
- hideKeyboard
- setAirplaneMode: enabled
- waitForAnimationToEnd
- tapOn: "Choose photos"
- waitForAnimationToEnd
- tapOn:
    text: "Photo taken on.*"
- tapOn:
    text: "Add.*"
- extendedWaitUntil:
    visible: "Saved for marking: Offline Student"
    timeout: 30000
- takeScreenshot: 30-offline-saved
- setAirplaneMode: disabled
# The header line (always on screen) shows "· 1 waiting" until the queued student is fully marked.
- extendedWaitUntil:
    notVisible: ".*1 waiting.*"
    timeout: 300000
- takeScreenshot: 31-marked-after-reconnect
- tapOn: "Mark register"
- assertVisible: "Offline Student"
- assertNotVisible: "Waiting"
- takeScreenshot: 32-offline-in-register
