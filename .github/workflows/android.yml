name: android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.9.1'

      - name: Firebase config (from repository secret, never committed)
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_B64" ]; then echo "::error::Add the GOOGLE_SERVICES_JSON_B64 repository secret"; exit 1; fi
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > app/google-services.json

      - name: Unit tests (marking engine + scanner geometry)
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        env:
          REDPEN_APPCHECK_DEBUG_TOKEN: ${{ secrets.REDPEN_APPCHECK_DEBUG_TOKEN }}
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: redpen-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/tests/
