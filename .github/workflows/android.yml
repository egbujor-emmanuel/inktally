name: android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REDPEN_KEYSTORE_PASSWORD: ${{ secrets.REDPEN_KEYSTORE_PASSWORD }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.9.1'

      - name: Firebase config (from repository secret, never committed)
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_B64" ]; then echo "::error::Add the GOOGLE_SERVICES_JSON_B64 repository secret"; exit 1; fi
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > app/google-services.json

      - name: Signing key (from repository secret, never committed)
        env:
          REDPEN_KEYSTORE_B64: ${{ secrets.REDPEN_KEYSTORE_B64 }}
        run: |
          if [ -n "$REDPEN_KEYSTORE_B64" ]; then echo "$REDPEN_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/redpen.p12"; echo "REDPEN_KEYSTORE_FILE=$RUNNER_TEMP/redpen.p12" >> "$GITHUB_ENV"; fi

      - name: Unit tests (marking engine, scanner geometry, register exports)
        run: gradle --no-daemon testDebugUnitTest

      - name: Independent check — the Android .xlsx opens in openpyxl with the right content
        run: |
          python3 -m pip install --quiet openpyxl==3.1.5
          python3 - <<'PY'
          from openpyxl import load_workbook
          ws = load_workbook('app/build/test-xlsx/register.xlsx').active
          text = ' | '.join(str(c.value) for row in ws.iter_rows() for c in row if c.value is not None)
          for want in ['Greenfield College', 'Mrs A. Okafor', 'English & <Grammar>', 'Revise past tenses', "'=HYPERLINK"]:
              assert want in text, f'missing {want!r} in {text[:400]}'
          assert ws.freeze_panes, 'header row should be frozen'
          print('openpyxl OK:', ws.title, ws.max_row, 'rows x', ws.max_column, 'cols')
          PY

      - name: Build debug APK
        env:
          REDPEN_APPCHECK_DEBUG_TOKEN: ${{ secrets.REDPEN_APPCHECK_DEBUG_TOKEN }}
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inktally-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/androidTest/debug/*.apk
            android/app/build/reports/tests/
